# Конфигурация сбора event-площадок Казахстана из 2GIS.
# Любое поле можно опустить - подставится значение по умолчанию из src/venues2gis/config.py

browser:
  # Путь к Chrome/Edge. null = искать автоматически.
  binary_path: null
  # headless заметно повышает риск попасть на антибот-страницу /museum.
  headless: false
  profile_dir: .chrome-profile
  block_resources: true
  window_size: "1400,1000"
  restart_every_tasks: 25

collect:
  country: kz
  # Наборы рубрик каталога 2GIS - скелет покрытия.
  #   core - 44 рубрики, заведомо площадки (4 тыс. организаций по Алматы)
  #   food - 16 рубрик, общепит и размещение (11,5 тыс. по Алматы)
  # Списки и замеры объёма: src/venues2gis/rubrics.py, out/rubric_totals_almaty.csv
  rubric_sets: [core, food]
  # Слои поисковых слов: rubric | ru | kz | en | extra - добирают "расширенные"
  # результаты, которые в рубрику не попали (ресторан со словом "банкет").
  # extra выключен: даёт много нерелевантного и сильно удлиняет прогон.
  layers: [rubric, ru, kz, en]
  # null = все регионы страны. Пример точечного прогона: [almaty, shymkent]
  regions: null

  # --- Перенастройка на свою задачу -------------------------------------
  # Два поля ниже полностью заменяют rubric_sets и layers. Механика сбора от
  # темы не зависит: телефоны, часы работы, адрес и координаты собираются
  # одинаково хоть для банкетных залов, хоть для автомоек.
  #
  # Свои рубрики каталога 2GIS (ID видно в адресе: /almaty/rubric/10803).
  # Полный справочник встреченных рубрик пишется в out/discovered_rubrics.csv.
  #   rubrics: ["10803", "17379"]
  rubrics: null
  # Свои поисковые слова вместо языковых слоёв.
  #   queries: ["автомойка", "шиномонтаж", "детейлинг"]
  queries: null
  # Параллельные воркеры - по одному окну Chrome на каждого.
  # Не подбирайте вручную: `python run.py doctor` посчитает под вашу машину.
  # Замер на 8 ядрах / 32 ГБ (tools/bench_workers.py):
  #   2 -> 0,78 карт/с   6 -> 1,66    12 -> 2,05
  #   4 -> 1,23          8 -> 2,07    16 -> 1,95
  # Скорость упирается в число физических ядер, дальше плато и спад.
  # Антибот 2GIS за все замеры не сработал ни разу - ограничитель это CPU.
  workers: 8
  # Сколько заведений воркер забирает из очереди за раз (фаза B).
  firm_batch: 25
  # У 2GIS нет потолка пагинации (проверено: 210 страниц на "Кафе" в Алматы).
  max_pages_per_task: 500
  max_cards_per_task: 6000
  # Задержки между действиями, мс (диапазон, берётся случайное значение).
  click_delay_ms: [350, 850]
  page_delay_ms: [400, 900]
  # 20 с, а не 12: под нагрузкой страница карточки иногда не успевает отдаться,
  # и это была единственная причина неудач в замерах.
  card_response_timeout_ms: 20000
  max_consecutive_misses: 4
  nav_timeout_ms: 60000
  max_attempts: 3
  antibot_pause_s: 60
  antibot_max_hits: 10

paths:
  data_dir: data
  raw_dir: data/raw
  db_path: data/state.sqlite
  regions_cache: data/regions.json
  out_dir: out
  log_dir: logs
